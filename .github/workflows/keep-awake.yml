# Keeps the free Render website awake. Render puts a free site to sleep after 15 minutes without visitors,
# so this opens it every 5 minutes (GitHub sometimes starts scheduled runs late, hence the short interval).
# Awake around the clock, one site uses about 744 of Render's 750 free hours a month.
#
# The address is https://adrx.onrender.com unless the repository variable SITE_URL says otherwise
# (Settings > Secrets and variables > Actions > Variables > New repository variable).
name: Keep the website awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open the website
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://adrx.onrender.com' }}
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 -o /dev/null "$SITE_URL/api/health"; then
              echo "Awake: $SITE_URL"
              exit 0
            fi
            echo "No answer yet (try $attempt of 3)"
            sleep 20
          done
          # a warning, not a failure: failed scheduled runs would email you every few minutes
          echo "::warning::$SITE_URL did not answer. Is the site deployed on Render?"
