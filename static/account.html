<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your password - AdRx</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="/" aria-label="AdRx home">
        <span class="brand__mark" aria-hidden="true">℞</span>
        <span class="brand__name">AdRx</span>
        <span class="brand__tag">NMC ad compliance check</span>
      </a>
      <nav class="account" id="account-menu" aria-label="Account" hidden></nav>
    </div>
  </header>

  <main class="wrap auth">
    <form id="password-form" class="desk auth__card" novalidate>
      <h1 class="auth__title" id="title">Change your password</h1>
      <p class="auth__lede" id="first-time" hidden>Welcome! Before you start, choose your own password. The one you
        were given was only for your first sign-in.</p>
      <p class="auth__lede" id="signed-in-as"></p>
      <input id="account-username" type="text" autocomplete="username" hidden>
      <div class="field">
        <label for="current-password">Current password</label>
        <input id="current-password" type="password" autocomplete="current-password" maxlength="256" required>
      </div>
      <div class="field">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="128"
               aria-describedby="password-rule" required>
        <p class="field__hint" id="password-rule">At least <span data-min-length>10</span> characters. A few unrelated
          words are easy to remember and hard to guess.</p>
      </div>
      <div class="field">
        <label for="confirm-password">New password again</label>
        <input id="confirm-password" type="password" autocomplete="new-password" maxlength="128" required>
      </div>
      <button type="submit" class="btn btn--primary btn--block" id="save-btn">Save new password</button>
      <p class="form-error" id="form-error" role="alert" hidden></p>
      <p class="form-ok" id="form-ok" role="status" hidden></p>
    </form>
  </main>

  <script src="/static/session.js"></script>
  <script src="/static/account.js"></script>
</body>
</html>
