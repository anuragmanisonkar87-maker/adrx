# Free hosting on Render (https://render.com). In the Render dashboard: New > Blueprint > pick this repository.
# Free web services have 512 MB of memory and a tenth of a CPU, and sleep after 15 minutes without visitors
# (the next visit then waits about a minute). The settings below are tuned for that.
services:
  - type: web
    name: adrx
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PUBLIC_SITE
        value: "true"
      - key: AI_REVIEW
        value: "off"
      - key: FORWARDED_ALLOW_IPS  # Render puts each visitor's IP address first in X-Forwarded-For
        value: "*"
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      - key: RATE_LIMIT_PER_DAY
        value: "60"
      - key: MAX_PARALLEL_CHECKS
        value: "1"
      - key: QUEUE_WAIT_SECONDS
        value: "240"
      - key: MAX_UPLOAD_MB  # an upload passes through /tmp (2 GB on Render) and is deleted after the check
        value: "250"
      - key: MAX_MEDIA_SECONDS
        value: "120"
      - key: MAX_PDF_PAGES
        value: "10"
      - key: MAX_VIDEO_FRAMES
        value: "8"
      - key: OCR_FRAME_SIDE
        value: "1280"
      - key: OCR_FRAME_WORKERS
        value: "1"
      # One thread each for ffmpeg and Tesseract: the server has a tenth of a CPU, so more threads only add memory
      # (ffmpeg starts one decoder per CPU of the machine it runs on: 300+ MB for a 4K video on 8 CPUs).
      - key: FFMPEG_THREADS
        value: "1"
      - key: OMP_THREAD_LIMIT
        value: "1"
      # The app opens its own address (Render sets RENDER_EXTERNAL_URL) every 10 minutes, so the site never
      # falls asleep. Awake all month, it uses about 744 of the 750 free hours a Render workspace gets, so
      # keep no other free web service in the same workspace (or set this to "off").
      - key: KEEP_AWAKE
        value: "on"
      # Sign-in: every check needs an account, and the admin manages accounts on the site's Users page.
      # ADMIN_PASSWORD is the first password of the "admin" account (at least 10 characters). DATABASE_URL is
      # where accounts are kept: Supabase's "Session pooler" connection string, pasted as Supabase shows it, and
      # DATABASE_PASSWORD is the database password (deploy/README.md). Without DATABASE_URL, accounts are kept on
      # Render's disk, which is wiped at every deploy and restart.
      - key: REQUIRE_LOGIN
        value: "on"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD  # Supabase's database password; fills [YOUR-PASSWORD] in DATABASE_URL
        sync: false
      # Speech-to-text: without a key, the small Whisper "base" model runs on the server itself (fine for
      # English, weak for Hindi). With a free Groq key (https://console.groq.com/keys) in OPENAI_API_KEY,
      # Groq runs Whisper large-v3 instead, its most accurate model for Hindi and Hinglish.
      - key: TRANSCRIBE_BACKEND
        value: auto
      - key: WHISPER_MODEL  # also read by the Docker build, which bakes the model into the image
        value: base
      - key: PRELOAD_WHISPER
        value: "1"
      - key: WHISPER_CPU_THREADS
        value: "1"
      - key: WHISPER_BEAM_SIZE
        value: "1"
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_TRANSCRIBE_MODEL
        value: whisper-large-v3
      - key: OPENAI_API_KEY
        sync: false
      - key: LOG_FILE
        value: ""
